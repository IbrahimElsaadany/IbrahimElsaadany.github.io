
<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ibrahim Elsaadany - Flutter Developer">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ibrahim_elsaadany">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>Ibrahim Elsaadany</title>

  <!-- Lottie Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splash-screen.hide {
      opacity: 0;
      visibility: hidden;
    }

    #lottie-animation {
      width: 240px;
      height: 240px;
      max-width: 80vw;
      max-height: 80vw;
    }

    @media (max-width: 600px) {
      #lottie-animation {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div id="lottie-animation"></div>
  </div>

  <script>
    const splash = document.getElementById('splash-screen');

    // Initialize Lottie
    if (window.lottie) {
      lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'assets/images/splash.json'
      });
    }

    // Hide splash after Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      splash.classList.add('hide');

      setTimeout(() => {
        splash.remove();
      }, 600);
    });
  </script>

  <!-- Flutter Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
