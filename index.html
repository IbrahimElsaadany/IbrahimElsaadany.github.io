
<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ibrahim Elsaadany - Flutter Developer">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ibrahim Elsaadany">

  <link rel="icon" href="icons/favicon.ico" type="image/x-icon" sizes="16x16 32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <title>Ibrahim Elsaadany</title>

  <script id="lottie-player" src="vendor/lottie-light-5.12.2.min.js" defer></script>

  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #fff;
      z-index: 99999;
      transition: opacity 200ms ease;
    }

    #splash-screen.hide {
      opacity: 0;
      pointer-events: none;
    }

    #splash-logo, #lottie-animation {
      grid-area: 1 / 1;
    }

    #splash-logo {
      width: min(96px, 30vmin);
      height: auto;
    }

    #lottie-animation {
      width: min(240px, 48vmin);
      aspect-ratio: 1;
    }

    @media (prefers-reduced-motion: reduce) {
      #splash-screen { transition: none; }
    }
  </style>
</head>

<body>

  <div id="splash-screen" role="status" aria-label="Loading portfolio">
    <img id="splash-logo" src="icons/app-icon-192.png" alt="">
    <div id="lottie-animation" aria-hidden="true"></div>
  </div>

  <script>
    const splash = document.getElementById('splash-screen');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let animation;

    document.getElementById('lottie-player').addEventListener('load', () => {
      if (reduceMotion.matches || splash.classList.contains('hide') || !window.lottie) return;
      animation = window.lottie.loadAnimation({
        container: document.getElementById('lottie-animation'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: 'assets/assets/images/splash.json'
      });
      animation.addEventListener('DOMLoaded', () => {
        document.getElementById('splash-logo').hidden = true;
      });
    });

    window.addEventListener('flutter-first-frame', () => {
      splash.classList.add('hide');
      setTimeout(() => {
        animation?.destroy();
        splash.remove();
      }, reduceMotion.matches ? 0 : 200);
    }, { once: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
